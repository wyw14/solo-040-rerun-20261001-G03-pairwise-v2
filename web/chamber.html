<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LockFlow Chamber</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><header><div class="brand"><span class="brand-mark">LF</span>LockFlow</div><nav><a href="/operations">Operations</a><a aria-current="page" href="/chamber">Chamber</a><a href="/interlocks">Interlocks</a><a href="/incidents">Incidents</a></nav></header>
<main><div class="page-title"><div><h1>Chamber situation</h1><div class="muted">Gate, cycle and leveling state with generation-bound targets</div></div><button id="refresh">Refresh</button></div><div class="grid" id="chambers"></div><div class="message" id="message"></div></main>
<script src="/assets/app.js"></script><script>
const {api,shortID,text,setMessage,withBusy}=window.LockFlow;
const host=document.querySelector('#chambers'); const message=document.querySelector('#message');
const fmt=(v,d=2)=>v===null||v===undefined?'-':Number(v).toFixed(d);
const age=(at)=>at?`${Math.max(0,Math.round((Date.now()-new Date(at).getTime())/1000))}s ago`:'-';
function levelingPanel(v){
  const p=v.plan, c=v.cycle, s=v.latest_sample, cfg=v.config;
  const identity=p?`${shortID(p.cycle_id)} · gen ${p.generation} · ${p.direction}`:'-';
  const stateClass=v.executable?'status':(v.plan_current?'status warning':'status critical');
  const stateText=!c?'no active transit':v.executable?'fresh — executable':(p?(v.plan_current?(p.executed?'executed':'samples stale / wrong stage'):'stale generation — locked'):'no plan built');
  const rows=(p?.instructions||[]).map((i)=>`<tr><td>${i.sequence}</td><td>${i.device}</td><td>${i.action}</td><td>${fmt(i.opening)}</td><td>${i.rationale}</td></tr>`).join('')
    ||'<tr><td colspan="5" class="muted">No valve steps (no plan or already within tolerance)</td></tr>';
  const reasons=(v.reasons||[]).map((r)=>`<li>${r}</li>`).join('');
  const samples=(p?.basis_samples||[]).map((sm)=>`${fmt(sm.meters)} m @ ${new Date(sm.observed_at).toLocaleTimeString()} [gen ${sm.generation}]`).join('<br>')||'-';
  return `<section class="panel wide" data-chamber="${v.chamber_id}">
    <h2>${v.chamber_id} — leveling target</h2>
    <div class="metrics">
      <div class="metric">Target / current<strong>${p?fmt(p.target_level_m):'-'} / ${s?fmt(s.meters):'-'} m</strong></div>
      <div class="metric">Delta (tol ${fmt(cfg.level_tolerance_m)})<strong>${p?(p.delta_m>=0?'+':'')+fmt(p.delta_m):'-'} m</strong></div>
      <div class="metric">Status<strong><span class="${stateClass}">${stateText}</span></strong></div>
    </div>
    <table>
      <tr><th>Bound transit</th><td>${identity}</td><th>Stage</th><td>${text(c?.stage)}</td></tr>
      <tr><th>Latest sample</th><td>${s?`${fmt(s.meters)} m · ${age(s.observed_at)}`: '-'}</td><th>Freshness limit</th><td>${cfg.sample_max_age_seconds}s / min ${cfg.minimum_samples} samples</td></tr>
      <tr><th>Plan basis samples</th><td colspan="3">${samples}</td></tr>
      <tr><th>Plan created</th><td>${p?new Date(p.created_at).toLocaleTimeString():'-'}</td><th>Executed</th><td>${p?.executed?`yes @ ${new Date(p.executed_at).toLocaleTimeString()}`:'no'}</td></tr>
    </table>
    <table><tr><th>#</th><th>Valve</th><th>Action</th><th>Opening</th><th>Rationale</th></tr>${rows}</table>
    <ul class="muted">${reasons}</ul>
    <div class="form-row">
      <div><label>Level reading (m)</label><input type="number" step="0.01" min="0" class="sample-input" placeholder="e.g. 4.20"></div>
      <div style="align-self:end"><button class="sample-btn">Send sample</button></div>
      <div style="align-self:end"><button class="plan-btn">Build plan</button></div>
      <div style="align-self:end"><button class="execute-btn" ${v.executable?'':'disabled'}>Execute plan</button></div>
    </div>
  </section>`;
}
async function chamberPanel(item){
  const v=await api(`/api/chambers/${item.chamber_id}/leveling`);
  return `<section class="panel"><h2>${item.chamber_id}</h2><div class="metrics"><div class="metric">Stage<strong>${item.cycle?.stage||'idle'}</strong></div><div class="metric">Upstream<strong>${item.gates?.upstream||'-'}</strong></div><div class="metric">Downstream<strong>${item.gates?.downstream||'-'}</strong></div></div><table><tr><th>Cycle</th><td>${shortID(item.cycle?.id)}</td></tr><tr><th>Queue</th><td>${item.queue?.length||0} vessel(s)</td></tr><tr><th>Emergency</th><td>${item.emergency?.status||'idle'}</td></tr></table></section>${levelingPanel(v)}`;
}
async function load(){
  const items=await api('/api/chambers');
  host.innerHTML=(await Promise.all(items.map(chamberPanel))).join('');
  setMessage(message,'');
}
async function act(chamberID,action,button){
  await withBusy(button,async()=>{
    try{
      const panel=host.querySelector(`[data-chamber="${chamberID}"]`);
      if(action==='sample'){const meters=Number(panel.querySelector('.sample-input').value);
        if(!meters) throw new Error('enter a level reading');
        await api(`/api/chambers/${chamberID}/levels/sample`,{method:'POST',body:JSON.stringify({meters})});
      }else if(action==='plan'){await api(`/api/chambers/${chamberID}/leveling/plan`,{method:'POST'});
      }else if(action==='execute'){const v=await api(`/api/chambers/${chamberID}/leveling`);
        if(!v.plan) throw new Error('no plan to execute');
        await api(`/api/chambers/${chamberID}/leveling/execute`,{method:'POST',body:JSON.stringify({cycle_id:v.plan.cycle_id,generation:v.plan.generation})});
      }
      await load();
    }catch(error){setMessage(message,error.message);}
  });
}
host.addEventListener('click',(event)=>{
  const button=event.target.closest('button.sample-btn,button.plan-btn,button.execute-btn');
  if(!button||button.disabled) return;
  const chamberID=button.closest('[data-chamber]').dataset.chamber;
  act(chamberID,button.className.includes('sample')?'sample':button.className.includes('plan')?'plan':'execute',button);
});
document.querySelector('#refresh').addEventListener('click',()=>load().catch((e)=>setMessage(message,e.message)));
load().catch((e)=>setMessage(message,e.message));
setInterval(()=>load().catch(()=>{}),5000);
</script></body></html>
